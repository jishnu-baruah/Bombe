[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"
multiline_func_header = "params_first"
quote_style = "double"
number_underscore = "thousands"
single_line_statement_blocks = "preserve"

# Deep-fuzz profile — used by `pnpm test:contracts:deep` (wired in T-108).
# Runs substantially more fuzz iterations to surface conservation bugs that
# the default 256-run budget misses.
[profile.deep]
# fuzz.runs = 100_000  # uncomment when T-108 lands
