# Bombe protocol subgraph, Mantle Sepolia (chain id 5003).
#
# Indexes the AgentAttestation contract so the /explorer page can read a full,
# ordered history of claims and attestations without the bounded getLogs range
# of the no-indexer path. Deployed to Mantle's hosted subgraph service; the
# query endpoint + redeploy command are in docs/DEPLOYMENTS.md, and the web app
# reads it via SUBGRAPH_URL (with an automatic getLogs fallback).
#
# startBlock is the AgentAttestation creation block (39592000) so a first index
# does not scan the whole chain.
specVersion: 0.0.5
description: Bombe attestor-network activity (claims + attestations) on Mantle Sepolia.
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: AgentAttestation
    network: mantle-sepolia
    source:
      address: "0xf2473a0a55D997233C8fBF987c197e7d2180470A"
      abi: AgentAttestation
      startBlock: 39592000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Claim
        - Attestation
      abis:
        - name: AgentAttestation
          file: ./abis/AgentAttestation.abi.json
      eventHandlers:
        - event: ClaimPosted(indexed bytes32,uint8,bytes32,string,uint256)
          handler: handleClaimPosted
        - event: Attested(indexed bytes32,indexed address,uint8,uint16,uint256)
          handler: handleAttested
        - event: ClaimClosed(indexed bytes32)
          handler: handleClaimClosed
      file: ./src/mapping.ts
