name: v2 daily streak

# Daily unattended decisive attestation of the flagship assets (BOMBE-V2-PRD WS3).
# Inert until OP-8 secrets exist: the posting step is gated on POSTING_KEY, so a
# scheduled run with no secrets logs that it is inert and exits cleanly.
# Public logs are the point. Misses and abstains are product, not embarrassment.

on:
  schedule:
    # 09:00 UTC daily. Wall-clock cadence; the streak cannot be backfilled.
    - cron: "0 9 * * *"
  workflow_dispatch: {}

# Never run two at once (idempotency at the workflow level).
concurrency:
  group: v2-streak
  cancel-in-progress: false

jobs:
  attest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      POSTING_KEY: ${{ secrets.POSTING_KEY }}
      ATTESTOR_KEY: ${{ secrets.ATTESTOR_KEY }}
      # reflector,rotor,stator: enables the best-effort corroborating attestors
      # (Rotor/Stator) so the daily claim carries triple-run redundancy by default.
      AGENT_KEYS: ${{ secrets.AGENT_KEYS }}
      RPC_URL: ${{ secrets.RPC_URL }}
      ATTESTATION_ADDRESS: ${{ secrets.ATTESTATION_ADDRESS }}
      AI_GATEWAY_BASE_URL: ${{ secrets.AI_GATEWAY_BASE_URL }}
      AI_GATEWAY_KEY: ${{ secrets.AI_GATEWAY_KEY }}
      AI_GATEWAY_MODELS: ${{ secrets.AI_GATEWAY_MODELS }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Gate: is the posting key present? (OP-8). Inert if not.
      - id: gate
        run: |
          if [ -n "$POSTING_KEY" ] && [ -n "$ATTESTOR_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Inert (no OP-8 secrets)
        if: steps.gate.outputs.ready != 'true'
        run: echo "OP-8 secrets (POSTING_KEY / ATTESTOR_KEY) not set; daily streak is inert. No post attempted."

      # Daily decisive run for both assets: dedupe (fail-closed), compute, append
      # to the streak surfaces. One retry window. Keyed/live; inert without OP-8.
      - name: Daily streak run
        if: steps.gate.outputs.ready == 'true'
        run: |
          MODE=live pnpm v2:streak || (echo "retrying once..." && sleep 30 && MODE=live pnpm v2:streak)

      # No git commit: the on-chain attestation history is the streak source of
      # truth (D13), and main is a protected branch. The streak is the daily set
      # of explorer-visible attestations; dedupe reads the chain, not a file.

      - name: Alert operator on failure
        if: failure() && steps.gate.outputs.ready == 'true'
        run: echo "::error::v2 daily streak run failed. Operator review needed (check key balances and RPC)."
