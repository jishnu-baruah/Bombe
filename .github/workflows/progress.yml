name: Progress dashboard

# Regenerates the README progress dashboard on every PR and commits it back to
# the PR branch, so every merge to `main` carries a fresh dashboard. The commit
# is authored as the repo owner (no bot/AI attribution). Self-terminates: the
# regenerated commit triggers one more run that finds no diff and stops.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  update:
    # Same-repo PRs only (forks can't push back); skip the dashboard's own commits.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regenerate progress dashboard
        run: node scripts/update-progress.mjs
      - name: Commit dashboard if changed
        run: |
          if ! git diff --quiet -- README.md; then
            git config user.name "Jishnu Baruah"
            git config user.email "52702792+jishnu-baruah@users.noreply.github.com"
            git add README.md
            git commit -m "chore: refresh progress dashboard"
            git push origin "HEAD:${{ github.head_ref }}"
          else
            echo "Dashboard already current — nothing to commit."
          fi
