name: CI
on:
  pull_request:
  push:
    branches-ignore: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      # No `version:` here — pnpm/action-setup reads the version from
      # package.json `packageManager`. Specifying both errors (ERR_PNPM_BAD_PM_VERSION).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `pnpm run ci` (not `pnpm ci`): pnpm reserves the bare `ci` command as a
      # built-in stub (ERR_PNPM_CI_NOT_IMPLEMENTED), so the package script must
      # be invoked via `run`. See DECISIONS.md D7.
      - run: pnpm run ci
